<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MochisBus - Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ocultar ojito nativo del navegador */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear,
        input[type="password"]::-webkit-contacts-auto-fill-button,
        input[type="password"]::-webkit-credentials-auto-fill-button {
            display: none !important;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-container">
        <div style="margin-bottom: 18px;">
            <div style="width:64px; height:64px; background:linear-gradient(135deg,#3b82f6,#1d4ed8); border-radius:18px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
                <i class="fa-solid fa-bus" style="font-size:1.8rem; color:white;"></i>
            </div>
        </div>

        <h2 class="brand-title">MochisBus</h2>
        <p class="subtitle">Rastrea tu camión en tiempo real</p>

        <form id="login-form">
            <div class="input-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Tu usuario" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password"
                        style="-webkit-text-security:disc; padding-right:44px;"
                        onpaste="return true">
                    <button type="button" id="toggle-pass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#64748b;cursor:pointer;padding:4px;z-index:2;" onclick="togglePass()">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <div id="error-msg" style="display:none; background:rgba(239,68,68,0.12); color:#fc8181; border:1px solid rgba(239,68,68,0.3); padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-top:8px; text-align:left;">
                <i class="fa-solid fa-circle-exclamation" style="margin-right:6px;"></i>
                <span id="error-text"></span>
            </div>

            <button type="submit" class="login-button" id="btn-login">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> INGRESAR
            </button>
        </form>

        <div class="links">
            <a href="/register_page">¿No tienes cuenta? <b>Regístrate aquí</b></a>
        </div>
    </div>

    <script>
        function togglePass() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errDiv = document.getElementById('error-msg');
            const errTxt = document.getElementById('error-text');
            errDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Entrando...';
                    if (data.is_admin) window.location.href = '/admin_panel';
                    else if (data.ruta_asignada) window.location.href = '/soy_chofer';
                    else window.location.href = '/dashboard';
                } else {
                    errTxt.textContent = data.message;
                    errDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> INGRESAR';
                }
            } catch (err) {
                errTxt.textContent = 'Error de conexión. Intenta de nuevo.';
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> INGRESAR';
            }
        });
    </script>
</body>
</html>
